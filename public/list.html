<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu | Gnana PrasBites</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #342b2b;
        }

        nav {
            background: #641e2b;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .hero {
            background: linear-gradient(120deg, #762536, #b84b40);
            color: white;
            text-align: center;
            padding: 40px 15px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box input, .search-box select {
            flex: 1;
            min-width: 180px;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .primary-btn {
            padding: 13px 20px;
            background: #8b2635;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        .primary-btn:hover {
            background: #641e2b;
        }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(60, 30, 20, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 15px 12px;
            border-bottom: 1px solid #eee4dc;
            text-align: left;
        }

        th {
            background: #641e2b;
            color: white;
        }

        tbody tr:hover {
            background: #fff6ef;
        }

        .action-btn {
            display: inline-block;
            padding: 9px 12px;
            margin: 3px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .view-btn {
            background: #e3f0ff;
            color: #164f8b;
        }

        .update-btn {
            background: #fff0cf;
            color: #805000;
        }

        .delete-btn {
            background: #fbe3e5;
            color: #a51d30;
            border: none;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #cfe4ff;
        }

        .update-btn:hover {
            background: #f5d99b;
        }

        .delete-btn:hover {
            background: #f4c5cb;
        }

        .status {
            text-align: center;
            padding: 22px;
            font-weight: bold;
        }

        .add-food {
            display: inline-block;
            margin-bottom: 20px;
        }

        footer {
            background: #641e2b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 27px;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>🍽️ Gnana PrasBites</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="insert.html">Add Food</a>
            <a href="list.html">Food Menu</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Our Delicious Food Menu 🍕</h1>
        <p>Explore your favourite foods at Gnana PrasBites!</p>
    </header>

    <main class="container">

        <a href="insert.html" class="primary-btn add-food">
            ➕ Add New Food
        </a>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by food name or ID...">

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snacks">Snacks</option>
                <option value="Pizza">Pizza</option>
                <option value="Burger">Burger</option>
                <option value="Dessert">Dessert</option>
                <option value="Beverages">Beverages</option>
                <option value="Other">Other</option>
            </select>

            <button class="primary-btn" id="resetButton" type="button">
                Show All
            </button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Food ID</th>
                        <th>Food Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Description</th>
                        <th>Availability</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="foodTableBody">
                    <tr>
                        <td colspan="7" class="status">
                            Loading food items...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="resultCount"></p>

    </main>

    <footer>
        <p>© 2026 Gnana PrasBites | Delicious Food, Happy Moments ❤️</p>
    </footer>

    <script>
        const tableBody = document.getElementById("foodTableBody");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const resultCount = document.getElementById("resultCount");

        let allFoods = [];

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function displayFoods(foods) {
            tableBody.innerHTML = "";

            if (!foods.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="status">
                            No food items found.
                        </td>
                    </tr>
                `;

                resultCount.textContent = "0 food items found.";
                return;
            }

            foods.forEach(food => {
                const row = document.createElement("tr");

                const id = encodeURIComponent(food.food_id);

                row.innerHTML = `
                    <td>${escapeHTML(food.food_id)}</td>
                    <td>${escapeHTML(food.food_name)}</td>
                    <td>${escapeHTML(food.category)}</td>
                    <td>₹${escapeHTML(food.price)}</td>
                    <td>${escapeHTML(food.description || "-")}</td>
                    <td>
                        ${Number(food.availability) === 1
                            ? "🟢 Available"
                            : "🔴 Not Available"}
                    </td>
                    <td>
                        <a class="action-btn view-btn"
                           href="listone.html?id=${id}">
                            👁 View
                        </a>

                        <a class="action-btn update-btn"
                           href="update.html?id=${id}">
                            ✏️ Update
                        </a>

                        <button class="action-btn delete-btn"
                                type="button"
                                data-id="${escapeHTML(food.food_id)}"
                                data-name="${escapeHTML(food.food_name)}">
                            🗑️ Delete
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);
            });

            resultCount.textContent =
                foods.length + " food item(s) displayed.";
        }

        async function loadFoods() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="status">
                        Loading food items...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch("/food");

                if (!response.ok) {
                    throw new Error("Server returned status " + response.status);
                }

                const result = await response.json();

                allFoods = Array.isArray(result)
                    ? result
                    : Array.isArray(result.data)
                        ? result.data
                        : Array.isArray(result.foods)
                            ? result.foods
                            : [];

                displayFoods(allFoods);

            } catch (error) {
                console.error("Loading food failed:", error);

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="status">
                            Unable to load food items.
                            Check that your Node.js server and MySQL are running.
                        </td>
                    </tr>
                `;

                resultCount.textContent = error.message;
            }
        }

        function filterFoods() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredFoods = allFoods.filter(food => {
                const matchesText =
                    String(food.food_id).toLowerCase().includes(query) ||
                    String(food.food_name || "").toLowerCase().includes(query);

                const matchesCategory =
                    !selectedCategory || food.category === selectedCategory;

                return matchesText && matchesCategory;
            });

            displayFoods(filteredFoods);
        }

        searchInput.addEventListener("input", filterFoods);
        categoryFilter.addEventListener("change", filterFoods);

        document.getElementById("resetButton")
            .addEventListener("click", () => {
                searchInput.value = "";
                categoryFilter.value = "";
                displayFoods(allFoods);
            });

        tableBody.addEventListener("click", async event => {
            const button = event.target.closest(".delete-btn");

            if (!button) return;

            const id = button.dataset.id;
            const name = button.dataset.name;

            if (!confirm(`Are you sure you want to delete "${name}"?`)) {
                return;
            }

            button.disabled = true;
            button.textContent = "Deleting...";

            try {
                const response = await fetch(
                    "/food/" + encodeURIComponent(id),
                    { method: "DELETE" }
                );

                const text = await response.text();

                let result = {};

                try {
                    result = text ? JSON.parse(text) : {};
                } catch {
                    throw new Error("Server returned an unexpected response.");
                }

                if (!response.ok || result.success === false) {
                    throw new Error(
                        result.error || result.message || "Could not delete food."
                    );
                }

                alert("Food item deleted successfully! ✅");
                await loadFoods();

            } catch (error) {
                alert("Delete failed: " + error.message);
                button.disabled = false;
                button.textContent = "🗑️ Delete";
            }
        });

        loadFoods();
    </script>

</body>
</html>
