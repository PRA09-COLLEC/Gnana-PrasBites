<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Food | Gnana PrasBites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="brand"> Gnana <span>PrasBites</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="insert.html">Add Food</a>
        <a href="list.html">List All</a>
        <a class="active" href="listone.html">List One</a>
        <a href="update.html">Update</a>
        <a href="delete.html">Delete</a>
    </nav>
</header>
<img src="images/dosa.jpg"
     alt="Food item"
     class="food-image">

<section class="page-banner">
    <h1>Discover Your Favourite Dish</h1>
    <p>Search for one food item using its unique ID.</p>
</section>

<main class="page-container">
    <div class="panel">
        <h2>Search Food Item</h2>

        <form id="searchForm">
            <div class="form-group">
                <label for="foodId">Enter Food ID</label>
                <input
                    type="number"
                    id="foodId"
                    min="1"
                    required
                    placeholder="Enter food ID, e.g. 1"
                >
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">
                    Search Food
                </button>
                <a href="list.html" class="btn btn-secondary">View All Food</a>
            </div>
        </form>

        <div id="message" class="message"></div>
    </div>

    <div class="panel">
        <h2>Food Details</h2>

        <div id="foodDetails" class="empty-state">
            Enter a food ID to display its details.
        </div>
    </div>
</main>

<footer>
    <a href="index.html" class="footer-brand">Gnana PrasBites</a>
    <p>Discover something delicious.</p>
</footer>

<script>
const API = "/food";

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function showMessage(text, type) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = "message " + type;
}

async function searchFood(id) {
    const details = document.getElementById("foodDetails");

    if (!id || !Number.isInteger(Number(id)) || Number(id) <= 0) {
        showMessage("Please enter a valid food ID.", "error");
        return;
    }

    try {
        const response = await fetch(`${API}/${encodeURIComponent(id)}`);

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "Food item not found.");
        }

        const food = await response.json();
        const isAvailable = Number(food.availability) === 1;

        details.className = "";
        details.innerHTML = `
            <div class="food-detail">
                <img
                    src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=700&q=80"
                    alt="Food presentation"
                >

                <div>
                    <span class="eyebrow">
                        FOOD ID: ${escapeHTML(food.food_id)}
                    </span>

                    <h2>${escapeHTML(food.food_name)}</h2>

                    <p><strong>Category:</strong>
                        ${escapeHTML(food.category)}
                    </p>

                    <p><strong>Price:</strong>
                        ₹${Number(food.price).toFixed(2)}
                    </p>

                    <p><strong>Description:</strong>
                        ${escapeHTML(food.description)}
                    </p>

                    <p style="margin-top:15px">
                        <span class="status ${isAvailable ? "" : "unavailable"}">
                            ${isAvailable ? "Available" : "Unavailable"}
                        </span>
                    </p>

                    <div class="form-actions">
                        <a class="btn btn-primary"
                           href="update.html?id=${encodeURIComponent(food.food_id)}">
                           Update Food
                        </a>
                    </div>
                </div>
            </div>
        `;

        showMessage("Food item found successfully!", "success");
    } catch (error) {
        details.className = "empty-state";
        details.textContent = "No food item found for this ID.";
        showMessage(error.message, "error");
    }
}

document.getElementById("searchForm").addEventListener("submit", function(event) {
    event.preventDefault();
    searchFood(document.getElementById("foodId").value.trim());
});

const params = new URLSearchParams(window.location.search);
const idFromURL = params.get("id");

if (idFromURL) {
    document.getElementById("foodId").value = idFromURL;
    searchFood(idFromURL);
}
</script>

</body>
</html>
